<title>BBQガイド</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ground:#f6f4ef; --panel:#ffffff; --ink:#221f1b; --ink-soft:#5f584e;
  --line:#e5ded2; --line-strong:#d8cfbf;
  --ember:#bb3b2c; --ember-ink:#7a2418; --ember-bg:#fbeae5;
  --sea:#0f6e66; --sea-ink:#0a534d; --sea-bg:#e4f1ef;
  --amber:#c67512;
  --shadow:0 1px 0 rgba(34,31,27,.04), 0 8px 24px -18px rgba(34,31,27,.5);
  --maxw:480px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#181512; --panel:#221e1a; --ink:#f2ede3; --ink-soft:#b3a998;
    --line:#332d26; --line-strong:#42392f;
    --ember:#e8735f; --ember-ink:#f4b7ab; --ember-bg:#2c1a16;
    --sea:#4fb5aa; --sea-ink:#8fd6cd; --sea-bg:#12241f;
    --amber:#e0a24a;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#181512; --panel:#221e1a; --ink:#f2ede3; --ink-soft:#b3a998;
  --line:#332d26; --line-strong:#42392f;
  --ember:#e8735f; --ember-ink:#f4b7ab; --ember-bg:#2c1a16;
  --sea:#4fb5aa; --sea-ink:#8fd6cd; --sea-bg:#12241f;
  --amber:#e0a24a;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans JP","Noto Sans TC","Noto Sans KR",system-ui,sans-serif;
  font-size:16px; line-height:1.7; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px; padding-block:0}
h1,h2,h3{font-family:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif; margin:0; text-wrap:balance; line-height:1.3}
p{margin:0}
a{color:var(--sea-ink)}
:focus-visible{outline:2.5px solid var(--sea); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important; transition:none!important}}
html{scroll-behavior:smooth}

.top{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--ground) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:10px; height:52px}
.brand{display:flex; align-items:center; gap:8px; min-width:0}
.brand .mk{font-size:18px; flex:none}
.brand b{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:15px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.langs{display:flex; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px; flex:none}
.langs button{appearance:none; border:0; background:transparent; color:var(--ink-soft); font:inherit; font-weight:700; font-size:12px; padding:5px 9px; border-radius:999px; cursor:pointer; line-height:1}
.langs button[aria-pressed="true"]{background:var(--ink); color:var(--ground)}

.hero{padding-block:20px 8px}
.eyebrow{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--sea-ink)}
.hero h1{font-weight:900; font-size:26px; margin-top:6px}
.hero .sub{color:var(--ink-soft); font-size:14px; margin-top:6px}

.warn{margin-top:16px; background:var(--ember-bg); border:1px solid color-mix(in srgb,var(--ember) 35%,var(--line)); border-radius:16px; padding:16px 15px 15px; box-shadow:var(--shadow)}
.warn .wh{display:flex; align-items:center; gap:8px; color:var(--ember-ink); font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:15px; letter-spacing:.02em}
.warn ul{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
.warn li{display:flex; gap:10px; align-items:flex-start; font-size:14.5px; line-height:1.55}
.warn li .ic{flex:none; width:22px; height:22px; border-radius:7px; background:var(--ember); color:#fff; display:grid; place-items:center; font-size:13px; margin-top:1px}
.warn li b{font-weight:700}

.toc{position:sticky; top:52px; z-index:15; background:color-mix(in srgb,var(--ground) 90%, transparent); backdrop-filter:blur(8px); margin-top:18px; padding-block:10px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.toc .row{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none}
.toc .row::-webkit-scrollbar{display:none}
.toc a{flex:none; text-decoration:none; color:var(--ink); background:var(--panel); border:1px solid var(--line-strong); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; white-space:nowrap}
.toc a .n{color:var(--sea-ink); font-variant-numeric:tabular-nums}

main{padding-block:6px 40px}
section{scroll-margin-top:112px; padding-top:26px}
.sec-head{display:flex; align-items:baseline; gap:10px}
.sec-head .n{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:13px; color:var(--sea-ink); font-variant-numeric:tabular-nums; letter-spacing:.05em}
.sec-head h2{font-weight:700; font-size:19px}
.card{margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.lead{color:var(--ink-soft); font-size:14px; margin-top:8px}
.subh{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:15px; color:var(--ink)}
.subh + p, .subh + .slot{margin-top:8px}

.rows{display:flex; flex-direction:column; gap:0}
.pr{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:11px 0; border-bottom:1px dashed var(--line-strong)}
.pr:last-child{border-bottom:0}
.pr .k{font-weight:700; font-size:14.5px}
.pr .v{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap}
.pr .v small{font-weight:700; font-size:12px; color:var(--ink-soft)}

.pay{display:flex; flex-direction:column; gap:9px; margin-top:14px}
.pay a{display:flex; align-items:center; justify-content:space-between; gap:10px; text-decoration:none; background:var(--sea); color:#fff; border-radius:12px; padding:14px 16px; font-weight:800; font-size:15px; box-shadow:var(--shadow)}
.pay a .arw{font-size:18px; opacity:.9}
.paynote{display:flex; gap:8px; align-items:flex-start; margin-top:12px; color:var(--ember-ink); font-size:13px; background:var(--ember-bg); border-radius:10px; padding:10px 12px}

.roompick{margin-top:14px; background:var(--sea-bg); border:1px solid color-mix(in srgb,var(--sea) 30%,var(--line)); border-radius:12px; padding:14px}
.roompick .rt{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:14px; color:var(--sea-ink); text-align:center}
.roompick .opts{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
.roompick .opts button{flex:1 1 40%; appearance:none; cursor:pointer; font:inherit; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:18px; color:#fff; background:var(--sea); border:0; border-radius:11px; padding:16px 10px; box-shadow:var(--shadow)}
.roombadge{display:flex; align-items:center; gap:10px; background:var(--sea-bg); border:1px solid color-mix(in srgb,var(--sea) 30%,var(--line)); border-radius:11px; padding:10px 14px}
.roombadge .rl{font-size:12px; font-weight:700; color:var(--sea-ink); letter-spacing:.04em; flex:none}
.roombadge .rv{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:20px; color:var(--sea-ink); flex:1}
.roombadge .chg{appearance:none; border:0; background:transparent; color:var(--sea-ink); font:inherit; font-size:12px; font-weight:700; text-decoration:underline; cursor:pointer; padding:4px; flex:none}

.bul{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:9px}
.bul li{display:flex; gap:10px; font-size:14.5px; line-height:1.55}
.bul li::before{content:""; flex:none; width:7px; height:7px; border-radius:50%; background:var(--sea); margin-top:8px}
.bul li.no::before{background:var(--ember)}
.bul li.strong{font-weight:800; color:var(--ember-ink)}

.slot{margin-top:10px; border:1.5px dashed color-mix(in srgb,var(--amber) 55%,var(--line)); background:color-mix(in srgb,var(--amber) 8%,var(--panel)); border-radius:10px; padding:12px 13px; color:var(--ink-soft); font-size:13.5px; display:flex; gap:9px; align-items:flex-start}
.slot .stag{flex:none; font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--amber); border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line)); border-radius:5px; padding:2px 6px; margin-top:1px; white-space:nowrap}
.photo{margin-top:10px; border:1.5px dashed var(--line-strong); border-radius:12px; padding:22px 12px; text-align:center; color:var(--ink-soft); font-size:13px; display:flex; flex-direction:column; align-items:center; gap:6px}
.photo .pi{font-size:22px}
.notebox{margin-top:10px; background:var(--ember-bg); border:1px solid color-mix(in srgb,var(--ember) 30%,var(--line)); border-radius:10px; padding:11px 13px; color:var(--ember-ink); font-size:13.5px; font-weight:700; display:flex; gap:8px; align-items:flex-start}
.vid{display:flex; align-items:center; gap:13px; margin-top:12px; text-decoration:none; background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; padding:13px 14px; box-shadow:var(--shadow)}
.vid .play{flex:none; width:42px; height:42px; border-radius:11px; background:var(--ember); color:#fff; display:grid; place-items:center; font-size:16px}
.vid .vtext{display:flex; flex-direction:column; min-width:0}
.vid .vtext b{color:var(--ink); font-weight:800; font-size:14.5px}
.vid .vtext small{color:var(--ink-soft); font-size:12px; margin-top:2px}

/* property picker */
.pick{padding-block:26px 40px}
.pick .card{padding:18px}
.pick h2{font-weight:900; font-size:20px}
.pick .pn{color:var(--ink-soft); font-size:13.5px; margin-top:8px}
.pick .opts{display:flex; flex-direction:column; gap:9px; margin-top:14px}
.pick .opts button{appearance:none; cursor:pointer; text-align:left; font:inherit; font-family:"Zen Kaku Gothic New",sans-serif; font-weight:800; font-size:15px; color:var(--ink); background:var(--panel); border:1px solid var(--line-strong); border-radius:11px; padding:14px 15px; box-shadow:var(--shadow)}

footer{border-top:1px solid var(--line); padding-block:20px 34px; color:var(--ink-soft); font-size:12px; text-align:center}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">

<div class="top">
  <div class="wrap">
    <div class="brand"><span class="mk">🔥</span><b id="brand"></b></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="ja" aria-pressed="true">日</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="zh" aria-pressed="false">繁</button>
      <button data-lang="ko" aria-pressed="false">한</button>
    </div>
  </div>
</div>

<!-- property picker (shown when ?p= missing/invalid) -->
<div class="pick wrap" id="propPick" hidden>
  <div class="card">
    <h2 data-t="pickPropTitle"></h2>
    <p class="pn" data-t="pickPropNote"></p>
    <div class="opts" id="propOpts"></div>
  </div>
</div>

<header class="hero" id="hero">
  <div class="wrap">
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>

    <div class="warn" role="note">
      <div class="wh"><span>⚠️</span><span data-t="warnTitle"></span></div>
      <ul>
        <li><span class="ic">¥</span><span><b data-t="w1"></b></span></li>
        <li><span class="ic">!</span><span><b data-t="w2"></b></span></li>
        <li><span class="ic">🧹</span><span><b data-t="w3"></b></span></li>
        <li id="warnTime"><span class="ic">⏱</span><span><b data-t="w4"></b></span></li>
        <li id="warnStore"><span class="ic">🔑</span><span><b id="w5b"></b></span></li>
        <li><span class="ic">🗑</span><span><b data-t="w6"></b></span></li>
      </ul>
    </div>
  </div>
</header>

<nav class="toc" aria-label="目次" id="toc">
  <div class="wrap"><div class="row">
    <a href="#pay"><span class="n">01</span><span data-t="s1"></span></a>
    <a href="#items"><span class="n">02</span><span data-t="s2"></span></a>
    <a href="#place"><span class="n">03</span><span data-t="s3"></span></a>
    <a href="#charcoal"><span class="n">04</span><span data-t="s4"></span></a>
    <a href="#fire"><span class="n">05</span><span data-t="s5"></span></a>
    <a href="#gomi"><span class="n">06</span><span data-t="s6"></span></a>
    <a href="#clean"><span class="n">07</span><span data-t="s7"></span></a>
    <a href="#notes"><span class="n">08</span><span data-t="s8"></span></a>
  </div></div>
</nav>

<main class="wrap" id="body">
  <section id="pay">
    <div class="sec-head"><span class="n">01</span><h2 data-t="s1"></h2></div>
    <div class="card">
      <div class="rows">
        <div class="pr"><div class="k" data-t="p_bbq"></div><div class="v">¥5,000</div></div>
        <div class="pr" id="rowCharcoal"><div class="k" data-t="p_charcoal"></div><div class="v">+¥1,500 <small data-t="opt"></small></div></div>
        <div class="pr"><div class="k" data-t="p_clean"></div><div class="v">+¥2,500 <small data-t="opt"></small></div></div>
      </div>
      <p class="lead" data-t="pay_cardnote"></p>
      <div class="roompick" id="roomPick" hidden><div class="rt"></div><div class="opts"></div></div>
      <div class="pay" id="payArea"></div>
      <div class="paynote"><span>❗</span><span data-t="payNote"></span></div>
    </div>
  </section>

  <section id="items">
    <div class="sec-head"><span class="n">02</span><h2 data-t="s2"></h2></div>
    <div class="card">
      <ul class="bul"><li id="i1"></li></ul>
      <p class="lead" id="iNote"></p>
    </div>
  </section>

  <section id="place">
    <div class="sec-head"><span class="n">03</span><h2 data-t="s3"></h2></div>
    <div class="card">
      <h3 class="subh" data-t="pl_area_h"></h3>
      <div class="notebox" id="noBackyard" hidden><span>🚫</span><span data-t="no_backyard"></span></div>
      <div class="slot"><span class="stag">物件別</span><span data-t="pl_area_slot"></span></div>
      <div class="photo"><span class="pi">📷</span><span data-t="pl_area_photo"></span></div>
    </div>
    <div class="card">
      <h3 class="subh" data-t="pl_store_h"></h3>
      <p id="storeBody"></p>
      <p class="lead" id="plPin"></p>
    </div>
  </section>

  <section id="charcoal">
    <div class="sec-head"><span class="n">04</span><h2 data-t="s4"></h2></div>
    <div class="card">
      <p class="lead" data-t="ch_lead"></p>
      <a class="vid" href="https://www.youtube.com/watch?v=pgsyBXWpqd0" target="_blank" rel="noopener">
        <span class="play">▶</span>
        <span class="vtext"><b data-t="ch_vtitle"></b><small data-t="ch_vnote"></small></span>
      </a>
    </div>
  </section>

  <section id="fire">
    <div class="sec-head"><span class="n">05</span><h2 data-t="s5"></h2></div>
    <div class="card">
      <ul class="bul">
        <li data-t="f1"></li>
        <li data-t="f2"></li>
        <li class="no strong" data-t="f3"></li>
      </ul>
    </div>
  </section>

  <section id="gomi">
    <div class="sec-head"><span class="n">06</span><h2 data-t="s6"></h2></div>
    <div class="card">
      <p class="lead" data-t="g_lead"></p>
      <div class="slot"><span class="stag">物件別</span><span data-t="g_slot"></span></div>
      <ul class="bul"><li class="no" data-t="g_meat"></li></ul>
      <div class="photo"><span class="pi">📷</span><span data-t="g_photo"></span></div>
    </div>
  </section>

  <section id="clean">
    <div class="sec-head"><span class="n">07</span><h2 data-t="s7"></h2></div>
    <div class="card">
      <ul class="bul">
        <li id="c1"></li>
        <li id="c2li"><span id="c2"></span></li>
      </ul>
      <h3 class="subh" style="margin-top:15px" data-t="c_wash_h"></h3>
      <p id="washBody"></p>
      <p class="lead" id="washOnly" hidden></p>
      <div class="notebox" id="washNo" hidden><span>🚫</span><span id="washNoText"></span></div>
      <p class="lead" data-t="c_daiko"></p>
    </div>
  </section>

  <section id="notes">
    <div class="sec-head"><span class="n">08</span><h2 data-t="s8"></h2></div>
    <div class="card">
      <ul class="bul">
        <li data-t="n1"></li>
        <li data-t="n2"></li>
        <li class="no" data-t="n3"></li>
      </ul>
    </div>
  </section>
</main>

<footer class="wrap"><span data-t="foot"></span></footer>

}
function getRoom(P){
  const r = new URLSearchParams(location.search).get("room");
  return (r && P.rooms[r.toLowerCase()]) ? r.toLowerCase() : null;
}
function setParam(k,v){
  const u = new URL(location.href);
  if(v===null) u.searchParams.delete(k); else u.searchParams.set(k,v);
  history.replaceState(null,"",u);
  render(currentLang);
}

function fillText(lang){
  const d = T[lang]; if(!d) return;
  document.documentElement.lang = lang==="ja"?"ja":lang==="en"?"en":lang==="zh"?"zh-Hant":"ko";
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = d[el.getAttribute("data-t")];
    el.textContent = (v===undefined? "" : v);
    el.hidden = (v==="");
  });
  document.querySelectorAll(".langs button").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.lang===lang ? "true":"false");
  });
}

function showPicker(lang){
  const d = T[lang];
  $("propPick").hidden = false;
  $("hero").hidden = true; $("toc").hidden = true; $("body").hidden = true;
  $("brand").textContent = d.brandTail;
  const opts = $("propOpts"); opts.innerHTML = "";
  Object.keys(PROPS).sort((a,b)=>PROPS[a].order-PROPS[b].order).forEach(k=>{
    const b = document.createElement("button");
    b.type="button"; b.textContent = PROPS[k].name[lang]||PROPS[k].name.ja;
    b.addEventListener("click", ()=>setParam("p",k));
    opts.appendChild(b);
  });
}

function renderRoom(lang, P){
  const d = T[lang];
  const payArea = $("payArea"), roomPick = $("roomPick");
  const keys = Object.keys(P.rooms);
  payArea.innerHTML = "";
  const single = keys.length === 1;
  let rk = getRoom(P);
  if(single) rk = keys[0];
  if(rk){
    roomPick.hidden = true;
    const r = P.rooms[rk];
    if(!single){
      const badge = document.createElement("div");
      badge.className = "roombadge";
      badge.innerHTML = '<span class="rl"></span><span class="rv"></span><button type="button" class="chg"></button>';
      badge.querySelector(".rl").textContent = d.roomLabel;
      badge.querySelector(".rv").textContent = r.label;
      const chg = badge.querySelector(".chg"); chg.textContent = d.change;
      chg.addEventListener("click", ()=>setParam("room",null));
      payArea.appendChild(badge);
    }
    const a = document.createElement("a");
    a.href = r.link; a.rel="noopener";
    a.innerHTML = '<span></span><span class="arw">→</span>';
    a.querySelector("span").textContent = single ? d.payBtn1 : d.payBtn.replace("{room}", r.label);
    payArea.appendChild(a);
  } else {
    roomPick.hidden = false;
    roomPick.querySelector(".rt").textContent = d.pickTitle;
    const opts = roomPick.querySelector(".opts"); opts.innerHTML = "";
    keys.forEach(k=>{
      const b = document.createElement("button");
      b.type="button"; b.textContent = P.rooms[k].label;
      b.addEventListener("click", ()=>setParam("room",k));
      opts.appendChild(b);
    });
  }
}

function render(lang){
  currentLang = lang;
  fillText(lang);
  const d = T[lang];
  const pk = getProp();
  if(!pk){ showPicker(lang); return; }
  const P = PROPS[pk];
  $("propPick").hidden = true; $("hero").hidden = false; $("toc").hidden = false; $("body").hidden = false;

  const nm = P.name[lang] || P.name.ja;
  $("brand").textContent = nm + "｜" + d.brandTail;
  $("title").textContent = d.title;
  $("subtitle").textContent = nm + d.subTail;

  // warnings: time (optional), store/passcode variant
  $("warnTime").hidden = !d.w4;
  $("w5b").textContent = P.passcode ? d.w5 : d.w5_note;

  // payment rows
  $("rowCharcoal").hidden = !P.charcoal;

  // items
  $("i1").textContent = P.electric ? d.i1_elec : d.i1;
  const iNote = $("iNote");
  if(P.charcoal && !P.electric){ iNote.textContent = d.i_note; iNote.hidden = false; }
  else { iNote.hidden = true; }

  // place
  $("noBackyard").hidden = !P.noBackyard;
  const storeBody = $("storeBody");
  if(P.store){ storeBody.textContent = P.store[lang] || P.store.ja; storeBody.style.color = ""; }
  else { storeBody.textContent = d.pl_store_slot; storeBody.style.color = "var(--ink-soft)"; }
  $("plPin").textContent = P.passcode ? d.pl_pin : d.pl_pin_note;

  // clean
  if(P.electric){ $("c1").textContent = d.c1_elec; $("c2li").hidden = true; }
  else { $("c1").textContent = d.c1; $("c2li").hidden = !!P.noWash; $("c2").textContent = d.c2; }

  // washing area (per property)
  const washBody = $("washBody"), washOnly = $("washOnly");
  if(P.noWash){
    washBody.hidden = true; washOnly.hidden = true;
  } else if(P.wash){
    washBody.hidden = false; washBody.textContent = P.wash[lang] || P.wash.ja; washBody.style.color = "";
    washOnly.hidden = false; washOnly.textContent = d.c_wash_only;
  } else {
    washBody.hidden = false; washBody.textContent = d.c_wash_ask; washBody.style.color = "";
    washOnly.hidden = true;
  }
  $("washNo").hidden = !P.washNo;
  if(P.washNo) $("washNoText").textContent = P.washNo[lang] || P.washNo.ja;

  renderRoom(lang, P);
}

document.querySelectorAll(".langs button").forEach(b=>{
  b.addEventListener("click", ()=>{ render(b.dataset.lang); try{localStorage.setItem("bbqlang",b.dataset.lang);}catch(e){} });
});
let start="ja";
try{ const s=localStorage.getItem("bbqlang"); if(s&&T[s]) start=s; }catch(e){}
render(start);
</script>
